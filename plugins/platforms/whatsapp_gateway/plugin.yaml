name: whatsapp_gateway-platform
label: WhatsApp (Channel Gateway-managed)
kind: platform
version: 1.0.0
description: >
  Thin platform adapter for Channel Gateway-managed WhatsApp linked-device
  delivery. Receives authenticated normalized events from Pieverse Channel
  Gateway and sends replies through its tenant-scoped endpoint. Linked-device
  session state remains in the platform session gateway.
author: Pieverse Platform
optional_env:
  - name: CHANNEL_GATEWAY_TENANT_TOKEN
    description: 'Per-instance token injected by the Pieverse control plane'
    prompt: 'Channel Gateway tenant token'
    password: true
  - name: CHANNEL_GATEWAY_URL
    description: 'Internal Pieverse Channel Gateway base URL'
    prompt: 'Channel Gateway URL'
    password: false
